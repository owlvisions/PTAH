name: PTAH upstream sync

on:
  schedule:
    # GitHub Actions schedules have a 5-minute minimum interval. This checks
    # upstream frequently without claiming a hard real-time delivery SLA.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptah-upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge-and-validate:
    # Never run this automation against the upstream project itself.
    if: github.repository != 'morluto/rea'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Upstream code runs here, so this job has read-only access and no push
    # credentials. It only hands a validated merge commit to the next job.
    permissions:
      contents: read
    outputs:
      status: ${{ steps.sync.outputs.status }}
      base: ${{ steps.sync.outputs.base }}
      upstream: ${{ steps.sync.outputs.upstream }}
      merged: ${{ steps.sync.outputs.merged }}
    steps:
      - name: Check out the PTAH fork with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Merge latest REA main with the PTAH conflict policy and validate
        id: sync
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          node scripts/ptah.mjs upstream-sync --branch "$BASE_BRANCH" --bundle "$RUNNER_TEMP/ptah-sync.bundle" > "$RUNNER_TEMP/sync.json"
          set -e
          cat "$RUNNER_TEMP/sync.json"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            for (const key of ["status", "base", "upstream", "merged"]) out.write(`${key}=${r[key] ?? ""}\n`);
            const summary = require("fs").createWriteStream(process.env.GITHUB_STEP_SUMMARY, { flags: "a" });
            summary.write(`### PTAH upstream sync: ${r.status}\n\n\`\`\`json\n${JSON.stringify(r, null, 2)}\n\`\`\`\n`);
          ' "$RUNNER_TEMP/sync.json"

      - name: Keep the validated merge for publication
        if: steps.sync.outputs.status == 'merged'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ptah-sync-bundle
          path: ${{ runner.temp }}/ptah-sync.bundle
          retention-days: 3

      - name: Keep the sync report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ptah-sync-report
          path: ${{ runner.temp }}/sync.json
          retention-days: 14

  publish:
    needs: merge-and-validate
    if: needs.merge-and-validate.outputs.status == 'merged'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No upstream code runs in this job: it verifies the merge commit's parents
    # and pushes it without force, or opens a review PR when auto-merge is off.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the PTAH fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch the validated merge bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ptah-sync-bundle
          path: ${{ runner.temp }}

      - name: Verify parents and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SYNC_BRANCH: bot/ptah-upstream-sync
          AUTOMERGE: ${{ vars.PTAH_UPSTREAM_AUTOMERGE || 'true' }}
          BASE_SHA: ${{ needs.merge-and-validate.outputs.base }}
          UPSTREAM_SHA: ${{ needs.merge-and-validate.outputs.upstream }}
          MERGED_SHA: ${{ needs.merge-and-validate.outputs.merged }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags "$RUNNER_TEMP/ptah-sync.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$MERGED_SHA"
          parents="$(git rev-list --parents -n1 "$MERGED_SHA" | cut -d' ' -f2-)"
          test "$parents" = "$BASE_SHA $UPSTREAM_SHA" || { echo "unexpected merge parents: $parents"; exit 1; }
          if [[ "$AUTOMERGE" == "true" ]]; then
            # Non-forced: if the default branch moved, the push is rejected and the next run retries.
            git push origin "${MERGED_SHA}:refs/heads/${BASE_BRANCH}"
            echo "Merged REA ${UPSTREAM_SHA:0:12} into ${BASE_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push --force-with-lease origin "${MERGED_SHA}:refs/heads/${SYNC_BRANCH}"
          pr_number="$(gh pr list --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          body="Automated merge of morluto/rea@${UPSTREAM_SHA:0:12} into PTAH, validated before publication. Auto-merge is disabled by the PTAH_UPSTREAM_AUTOMERGE repository variable."
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "chore: sync latest REA upstream" --body "$body"
          else
            gh pr create --draft --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --title "chore: sync latest REA upstream" --body "$body"
          fi

  report-conflict:
    needs: merge-and-validate
    if: >-
      needs.merge-and-validate.outputs.status == 'conflict' ||
      needs.merge-and-validate.outputs.status == 'validation-failed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the sync issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ needs.merge-and-validate.outputs.status }}
          UPSTREAM_SHA: ${{ needs.merge-and-validate.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="PTAH upstream sync needs attention"
          body="Merging morluto/rea@${UPSTREAM_SHA:0:12} stopped with status \`${STATUS}\`. The default branch was not changed. Details and the sync report: ${RUN_URL}"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
