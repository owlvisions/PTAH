name: PTAH validation

on:
  push:
    branches: [main, ptah]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptah-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ptah-native:
    name: PTAH-native tests (dependency-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Check PTAH JavaScript syntax
        run: |
          node --check scripts/ptah.mjs
          node --check scripts/ptah-engine.mjs
          node --check scripts/ptah-mcp.mjs
          node --check scripts/ptah-ui.mjs
          node --check scripts/ptah-ui-server.mjs
      - name: Run PTAH-native test suite
        run: npm run test:ptah

  upstream-baseline:
    name: Upstream typecheck, lint, and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate dependency installation
        run: npm run deps:check
      - name: Run repository CI checks
        run: npm run check:ci
